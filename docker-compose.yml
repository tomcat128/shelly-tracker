# Ein Container: App + SQLite-Datenbank. Die DB liegt im gemounteten Ordner ./data.
services:
  shelly-tracker:
    build: .
    image: shelly-tracker:latest
    container_name: shelly-tracker
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HOST_PORT:-9090}:8000"
    volumes:
      - ./data:/data
      - ./config:/config:ro
